<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>chat_jpt</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; }
    #log { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
    .msg { padding: 10px 14px; border-radius: 10px; white-space: pre-wrap; max-width: 85%; }
    .user { background: #dbeafe; align-self: flex-end; }
    .assistant { background: #f1f5f9; align-self: flex-start; }
    .error { background: #fee2e2; align-self: flex-start; }
    form { display: flex; gap: 8px; }
    input { flex: 1; padding: 10px; font-size: 16px; }
    button { padding: 10px 16px; }
    #stats { color: #64748b; font-size: 12px; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>chat_jpt</h1>
  <div id="log"></div>
  <form id="form">
    <input id="input" placeholder="Say something..." autocomplete="off" required>
    <button id="send">Send</button>
  </form>
  <div id="stats"></div>

  <script>
    let conversationId = null;
    const log = document.getElementById("log");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const stats = document.getElementById("stats");

    function addMessage(role, text) {
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      div.textContent = text;
      log.appendChild(div);
      return div;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const message = input.value.trim();
      if (!message) return;

      input.value = "";
      send.disabled = true;
      addMessage("user", message);
      const out = addMessage("assistant", "");

      try {
        const res = await fetch("/chat/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, conversation_id: conversationId }),
        });
        if (!res.ok) {
          const err = await res.json();
          throw new Error(typeof err.detail === "string" ? err.detail : JSON.stringify(err.detail));
        }
        conversationId = res.headers.get("X-Conversation-Id");

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          out.textContent += decoder.decode(value, { stream: true });
        }

        const u = await (await fetch("/usage")).json();
        stats.textContent = `${u.requests} requests · ${u.input_tokens + u.output_tokens} tokens · $${u.cost_usd.toFixed(6)}`;
      } catch (err) {
        out.className = "msg error";
        out.textContent = `Error: ${err.message}`;
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
